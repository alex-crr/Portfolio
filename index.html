  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;

    let bin = '';

      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));

    // events at the element — warn only; real JS errors carry message/error.

      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));

    // its OWN frames — from local text at the root, or text obtained from

    // navigation stays same-origin with its initiator and a deduped page

    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).

    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged

    // an origin exists), and both directions are origin-gated (on https

    // opaque contexts — file:// — everything serializes as 'null', where

    // deny-by-default: one request form, one reply form, no error

    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.

      // and sender identity (own child frame / direct parent) is checked

    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.

    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down

      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }

      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];

        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }

    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }

      return out;

    window.addEventListener('message', function (e) {

      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss

        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }

        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;

      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {

        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

            const reader = ds.readable.getReader();

            writer.close();

            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;

            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }

            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }

          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }

        console.error('Failed to decode asset ' + uuid + ':', err);

        resourceBlobs[blobUrls[uuid]] = blob;
      }

    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  <script type="__bundler/template">"<!DOCTYPE html>\n<html><head><title>Alexandre COURRIEU | Engineering Portfolio<\/title><meta name=\"description\" content=\"Engineering portfolio of Alexandre Courrieu: 3D printers, hybrid manufacturing, E-Spin, Fusion 360 add-ins.\">\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<script src=\"630a8abd-d528-4cb2-9cb1-39579f897ebe\"><\/script>\n<\/head>\n<body>\n<x-dc>\n<helmet>\n\n\n<style>html:not(.dc-up) body>*{visibility:hidden;animation:dc-show 0s 4s forwards}@keyframes dc-show{to{visibility:visible}}<\/style><style>\n\n/* latin */\n@font-face {\n  font-family: 'Archivo';\n  font-style: normal;\n  font-weight: 400 800;\n  font-stretch: 62% 125%;\n  font-display: swap;\n  src: url(\"f71c08c4-3a48-40e5-a7d2-645325232d67\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n\n\n\n\n/* latin */\n@font-face {\n  font-family: 'IBM Plex Mono';\n  font-style: normal;\n  font-weight: 400;\n  font-display: swap;\n  src: url(\"598bdafe-85c1-4ec1-ba5f-b04cb561ad10\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n\n\n\n\n/* latin */\n@font-face {\n  font-family: 'IBM Plex Mono';\n  font-style: normal;\n  font-weight: 500;\n  font-display: swap;\n  src: url(\"c49d43ce-f3a5-4192-95dc-b766dc57c42d\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n<\/style>\n<style>\nhtml,body{margin:0;height:100%;overflow:hidden;background:#d3d4d0;color:#141414}\n*{box-sizing:border-box}\na{color:inherit;text-decoration:none}\na:hover{color:var(--acc)}\n::selection{background:var(--acc);color:var(--accInk)}\n<\/style>\n<\/helmet>\n\n<div ref=\"{{ rootRef }}\" style=\"position:fixed;inset:0;display:flex;flex-direction:column;background:var(--bg,#0f1011);color:var(--ink,#e6e4df);font-family:var(--fB);transition:background-color .5s ease,color .5s ease\">\n\n  <nav style=\"flex:0 0 64px;display:flex;align-items:stretch;border-bottom:var(--sep);position:relative;z-index:10;background:var(--bg)\">\n    <div style=\"display:flex;align-items:center;gap:10px;padding:0 clamp(12px,1.5vw,20px);border-right:var(--sep);flex:none\">\n      <span style=\"width:8px;height:8px;border-radius:50%;background:var(--acc);box-shadow:0 0 10px var(--acc)\"><\/span>\n      <span style=\"font-family:var(--fD);font-weight:var(--dW);font-stretch:var(--dSt);text-transform:var(--dTr);font-size:20px;letter-spacing:var(--navLS);white-space:nowrap\">{{ brand }}<\/span>\n    <\/div>\n    <div ref=\"{{ tabsRef }}\" style=\"display:flex;flex:1;min-width:0;overflow-x:auto;scrollbar-width:none\">\n      <sc-for list=\"{{ tabs }}\" as=\"t\" hint-placeholder-count=\"5\">\n        <button sc-camel-on-click=\"{{ t.go }}\" style=\"all:unset;cursor:pointer;display:flex;align-items:center;gap:6px;padding:0 clamp(10px,1.4vw,20px);border-right:var(--sep);font-family:var(--fM);font-size:13px;letter-spacing:.08em;white-space:nowrap;color:{{ t.color }};background:{{ t.bg }};transition:background .3s ease,color .3s ease\">\n          <span style=\"opacity:.6;display:{{ numDisp }}\">[{{ t.num }}]<\/span><span>{{ t.label }}<\/span>\n        <\/button>\n      <\/sc-for>\n    <\/div>\n    <div style=\"display:flex;align-items:stretch;border-left:var(--sep);flex:none\">\n      <sc-for list=\"{{ styleOpts }}\" as=\"so\" hint-placeholder-count=\"3\">\n        <button sc-camel-on-click=\"{{ so.go }}\" style=\"all:unset;cursor:pointer;display:flex;align-items:center;padding:0 clamp(10px,1.2vw,18px);border-left:var(--sep);font-family:var(--fM);font-size:13px;letter-spacing:.08em;white-space:nowrap;color:{{ so.color }};background:{{ so.bg }};transition:background .3s ease,color .3s ease\">{{ so.label }}<\/button>\n      <\/sc-for>\n    <\/div>\n  <\/nav>\n\n  <main ref=\"{{ mainRef }}\" style=\"flex:1;position:relative;overflow:hidden;min-height:0\">\n    <div style=\"display:flex;height:100%;transform:{{ trackT }};transition:{{ moveTr }};will-change:transform\">\n\n      <div style=\"flex:0 0 100%;height:100%;min-width:0;overflow:hidden\">\n        <section data-screen-label=\"00 Index\" style=\"height:100%;padding:var(--pad);display:flex\">\n          <div style=\"flex:1;min-width:0;border:var(--frame);border-top:var(--frameTop);display:grid;grid-template-columns:var(--idxCols);grid-template-rows:var(--idxRows);gap:var(--gap);min-height:0;overflow:hidden\">\n            <div style=\"position:relative;background:var(--panel);border-radius:var(--r);border-right:var(--innerSep);padding:clamp(20px,min(5vw,5vh),64px);display:flex;flex-direction:column;justify-content:space-between;gap:24px;min-height:0;overflow:hidden\">\n              <sc-for list=\"{{ register }}\" as=\"r\" hint-placeholder-count=\"0\">\n                <div style=\"position:absolute;inset:0;z-index:2;pointer-events:none;background:{{ r.pvBg }};opacity:{{ r.po }};transition:opacity .35s ease\">\n                  <div style=\"position:absolute;inset:{{ r.pvInset }}\">\n                    <img src=\"{{ r.pv }}\" alt=\"\" decoding=\"async\" style=\"width:100%;height:100%;object-fit:{{ r.pvFit }};filter:{{ r.pvF }};mix-blend-mode:{{ r.pvB }};transform:{{ r.pvT }};transition:transform .9s cubic-bezier(.2,.7,0,1)\">\n                  <\/div>\n                  <div style=\"position:absolute;left:0;right:0;bottom:0;padding:clamp(20px,min(5vw,5vh),56px);padding-top:96px;background:linear-gradient(to bottom,transparent,{{ r.pvBg }} 70px);display:flex;flex-direction:column;gap:12px\">\n                    <span style=\"font-family:var(--fM);font-siz ize:10px;letter-spacing:.1em\">FIG. 1 \u2014 PORTRAIT<\/span>\n                <\/div>\n                <div style=\"background:var(--panel);border-radius:var(--r);border-right:var(--innerSep);padding:clamp(20px,3vw,40px)\">\n                  <div style=\"font-family:var(--fM);font-size:10px;letter-spacing:.1em;color:var(--acc);margin-bottom:12px\">[A01] BACKGROUND<\/div>\n                  <h3 style=\"margin:0 0 20px;font-family:var(--fD);font-weight:var(--dW);font-stretch:var(--dSt);text-transform:var(--dTr);letter-spacing:var(--dLS2);font-size:clamp(32px,6vh,52px);line-height:.92\">My Journey<\/h3>\n                  <p style=\"margin:0 0 16px;font-size:15px;line-height:1.7;text-wrap:pretty\">As an engineering student and maker, I've always been fascinated by building things that solve real-world problems. My passion for robotics, manufacturing, and creative engineering solutions drives me to constantly explore and learn.<\/p>\n                  <p style=\"margin:0;font-size:15px;line-height:1.7;text-wrap:pretty\">I'm currently pursuing my engineering degree at ESILV, where I'm developing both technical skills and innovative thinking to create impactful engineering solutions.<\/p>\n                <\/div>\n                <div style=\"background:var(--panel);border-radius:var(--r);padding:clamp(20px,3vw,32px);display:flex;flex-direction:column;gap:6px\">\n                  <div style=\"font-family:var(--fM);font-size:10px;letter-spacing:.1em;color:var(--acc);margin-bottom:6px\">[A02] SKILLS<\/div>\n                  <sc-for list=\"{{ skills }}\" as=\"k\" hint-placeholder-count=\"4\">\n                    <div style=\"display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:6px 12px;padding:10px 0;border-top:var(--sep)\">\n                      <span style=\"font-size:14px;font-weight:500\">{{ k.name }}<\/span>\n                      <div style=\"display:flex;gap:3px\">\n                        <sc-for list=\"{{ k.segs }}\" as=\"g\" hint-placeholder-count=\"4\">\n                          <span style=\"width:14px;height:10px;background:{{ g.bg }};border:1px solid {{ g.bd }};transition:background .2s steps(1) {{ g.d }}\"><\/span>\n                        <\/sc-for>\n                      <\/div>\n                      <span style=\"grid-column:1 / span 2;font-family:var(--fM);font-size:10px;letter-spacing:.1em;color:var(--steel)\">{{ k.tier }} \u2014 {{ k.note }}<\/span>\n                    <\/div>\n                  <\/sc-for>\n                  <div style=\"font-family:var(--fM);font-size:10px;letter-spacing:.1em;color:var(--acc);margin:18px 0 6px\">[A03] EDUCATION<\/div>\n                  <sc-for list=\"{{ education }}\" as=\"e\" hint-placeholder-count=\"3\">\n                    <div style=\"display:grid;grid-template-columns:96px minmax(0,1fr);gap:12px;padding:10px 0;border-top:var(--sep)\">\n                      <span style=\"font-family:var(--fM);font-size:10px;color:var(--steel);padding-top:3px\">{{ e.date }}<\/span>\n                      <span><span style=\"display:block;font-weight:700\">{{ e.title }}<\/span><span style=\"font-size:13px;color:var(--steel)\">{{ e.sub }}<\/span><\/span>\n                    <\/div>\n                  <\/sc-for>\n                <\/div>\n              <\/div>\n            <\/div>\n          <\/section>\n\n          <section data-screen-label=\"06 Contact\" style=\"height:100%;padding:var(--pad);display:flex\">\n            <div style=\"flex:1;min-width:0;border-radius:var(--r);display:flex;flex-direction:column;min-height:0;background:var(--acc);color:var(--accInk)\">\n              <div style=\"display:flex;justify-content:space-between;padding:8px 14px;border-bottom:1px solid currentColor;font-family:var(--fM);font-size:10px;letter-spacing:.1em\"><span>AC-06-ABT \u2014 CONTACT<\/span><span>SHEET 02 / 02<\/span><\/div>\n              <div style=\"flex:1;min-height:0;overflow:auto;scrollbar-width:thin;padding:clamp(24px,5vw,64px);display:flex;flex-direction:column;justify-content:space-between;gap:36px;opacity:{{ contact.o }};transform:{{ contact.t }};transition:opacity .5s ease .2s,transform .7s cubic-bezier(.2,.7,0,1) .2s\">\n                <div>\n                  <div style=\"font-family:var(--fM);font-size:10px;letter-spacing:.1em;margin-bottom:16px\">[C01] GET IN TOUCH<\/div>\n                  <h2 style=\"margin:0;font-family:var(--fD);font-weight:var(--dW);font-stretch:var(--dSt);text-transform:var(--dTr);letter-spacing:var(--dLS);font-size:clamp(36px,min(6vw,9vh),92px);line-height:.92;max-width:18ch;text-wrap:balance\">Feel free to reach out for collaborations, job opportunities, or just to say hello.<\/h2>\n                <\/div>\n                <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));border-top:1px solid currentColor\">\n                  <sc-for list=\"{{ contacts }}\" as=\"ct\" hint-placeholder-count=\"3\">\n                    <a href=\"{{ ct.href }}\" target=\"_blank\" style=\"display:flex;flex-direction:column;gap:6px;padding:18px 18px 18px 0\" style-hover=\"{opacity:.65}\">\n                      <span style=\"font-family:var(--fM);font-size:10px;letter-spacing:.1em\">{{ ct.label }} \u2197<\/span>\n                      <span style=\"font-size:16px;word-break:break-all\">{{ ct.value }}<\/span>\n                    <\/a>\n                  <\/sc-for>\n                <\/div>\n                <div style=\"display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;font-family:var(--fM);font-size:10px;letter-spacing:.1em\">\n                  <span>\u00a9 2025 Alexandre COURRIEU. All rights reserved.<\/span><span>BUILT WITH PRECISION<\/span>\n                <\/div>\n              <\/div>\n            <\/div>\n          <\/section>\n        <\/div>\n      <\/div>\n\n      <div style=\"flex:0 0 100%;height:100%;min-width:0;overflow:hidden\">\n        <section data-screen-label=\"07 Void\" style=\"--bg:#141516;--panel:#1f2022;--panel2:#252628;--ink:#e6e6e2;--steel:#9a9c9f;--sep:1px solid #323437;--void:#ff8a80;--acc:oklch(0.72 0.13 250);height:100%;padding:var(--pad);display:flex;background:var(--bg);color:var(--ink)\">\n          <div style=\"flex:1;min-width:0;display:flex;flex-direction:column;min-height:0;gap:var(--gap)\">\n            <div style=\"display:flex;justify-content:space-between;padding:8px 14px;border-bottom:var(--sep);font-family:var(--fM);font-size:10px;letter-spacing:.1em;color:var(--steel)\"><span>AC-07-VOID \u2014 SUPERSEDED DRAWINGS<\/span><span><span style=\"color:var(--void)\">{{ voidCount }}<\/span> WITHDRAWN<\/span><\/div>\n            <div style=\"flex:1;min-height:0;overflow:auto;scrollbar-width:thin;display:flex;flex-direction:column;gap:var(--gap)\">\n              <div style=\"display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:12px 40px;padding:4px 0 6px;opacity:{{ voidHead.o }};transform:{{ voidHead.t }};transition:opacity .5s ease .15s,transform .7s cubic-bezier(.2,.7,0,1) .15s\">\n                <h2 style=\"margin:0;font-family:var(--fD);font-weight:var(--dW);font-stretch:var(--dSt);text-transform:var(--dTr);letter-spacing:var(--dLS);font-size:clamp(32px,min(4vw,6vh),56px);line-height:.9\">Things I stopped building<\/h2>\n                <p style=\"margin:0;max-width:44ch;font-size:14px;line-height:1.6;color:var(--steel);text-wrap:pretty\">Each of these stopped on a decision, not by drifting. Paused ones may come back; the rest taught something still running in the live set.<\/p>\n              <\/div>\n              <div style=\"display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,340px),1fr));grid-auto-rows:minmax(300px,1fr);gap:var(--gap)\">\n                <sc-for list=\"{{ voids }}\" as=\"v\" hint-placeholder-count=\"0\">\n                  <article style=\"background:var(--panel);border-radius:var(--r);display:flex;flex-direction:column;overflow:hidden;opacity:{{ v.o }};transform:{{ v.t }};transition:opacity .5s ease {{ v.d }},transform .7s cubic-bezier(.2,.7,0,1) {{ v.d }}\">\n                    <div style=\"position:relative;flex:1;min-height:140px;background:repeating-linear-gradient(45deg,var(--panel) 0 1px,var(--panel2) 1px 10px)\">\n                      <sc-if value=\"{{ v.hasImg }}\" hint-placeholder-val=\"{{ false }}\">\n                        <img src=\"{{ v.img }}\" alt=\"{{ v.title }}\" loading=\"lazy\" decoding=\"async\" style=\"position:absolute;inset:0;width:100%;height:100%;object-fit:cover;filter:grayscale(1) contrast(1.05)\">\n                      <\/sc-if>\n                      <sc-if value=\"{{ v.noImg }}\" hint-placeholder-val=\"{{ true }}\">\n                        <span style=\"position:absolute;left:14px;bottom:12px;font-family:var(--fM);font-size:10px;letter-spacing:.1em;color:var(--steel)\">NO PHOTO ON RECORD<\/span>\n                      <\/sc-if>\n                      <span style=\"position:absolute;top:14px;right:14px;transform:rotate(-8deg);border:3px double var(--void);color:var(--void);background:var(--panel);padding:3px 10px;font-family:var(--fM);font-size:12px;font-weight:500;letter-spacing:.14em\">{{ v.status }}<\/span>\n                    <\/div>\n                    <div style=\"display:grid;grid-template-columns:minmax(0,1fr) auto;border-top:var(--sep)\">\n                      <div style=\"padding:12px 14px;border-right:var(--sep)\">\n                        <div style=\"font-family:var(--fD);font-weight:var(--dW);font-stretch:var(--dSt);text-transform:var(--dTr);font-size:22px;line-height:1;margin-bottom:6px\">{{ v.title }}<\/div>\n                        <div style=\"font-size:13px;line-height:1.45;color:var(--steel);text-wrap:pretty\">{{ v.why }}<\/div>\n                      <\/div>\n                      <div style=\"display:flex;flex-direction:column;font-family:var(--fM);font-size:10px;letter-spacing:.08em;min-width:118px\">\n                        <span style=\"padding:8px 12px;border-bottom:var(--sep);color:var(--void)\">{{ v.id }}<\/span>\n                        <span style=\"padding:8px 12px;border-bottom:var(--sep);color:var(--steel)\">{{ v.years }}<\/span>\n                        <span style=\"padding:8px 12px;color:var(--steel)\">{{ v.cause }}<\/span>\n                      <\/div>\n                    <\/div>\n                    <div style=\"display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 14px;border-top:var(--sep);font-family:var(--fM);font-size:11px\">\n                      <sc-if value=\"{{ v.hasGo }}\" hint-placeholder-val=\"{{ false }}\">\n                        <button sc-camel-on-click=\"{{ v.go }}\" style=\"all:unset;cursor:pointer;color:var(--acc)\">\u2192 {{ v.fw }}<\/button>\n                      <\/sc-if>\n                      <sc-if value=\"{{ v.noGo }}\" hint-placeholder-val=\"{{ true }}\">\n                        <span style=\"color:var(--steel)\">\u2192 {{ v.fw }}<\/span>\n                      <\/sc-if>\n                      <sc-if value=\"{{ v.hasHref }}\" hint-placeholder-val=\"{{ false }}\">\n                        <a href=\"{{ v.href }}\" target=\"_blank\" rel=\"noopener\" style=\"flex:none;letter-spacing:.1em;color:var(--steel)\">SOURCE \u2197<\/a>\n                      <\/sc-if>\n                    <\/div>\n                  <\/article>\n                <\/sc-for>\n              <\/div>\n            <\/div>\n          <\/div>\n        <\/section>\n      <\/div>\n    <\/div>\n\n    <div ref=\"{{ crossX }}\" style=\"position:absolute;top:0;bottom:0;left:0;width:1px;background:var(--acc);opacity:0;pointer-events:none;z-index:7;transition:opacity .3s ease\"><\/div>\n    <div ref=\"{{ crossY }}\" style=\"position:absolute;left:0;right:0;top:0;height:1px;background:var(--acc);opacity:0;pointer-events:none;z-index:7;transition:opacity .3s ease\"><\/div>\n\n    <button sc-camel-on-click=\"{{ left }}\" aria-label=\"Previous\" style=\"all:unset;cursor:pointer;position:absolute;left:8px;top:50%;width:44px;height:44px;margin-top:-22 emplate-rows:auto minmax(0,1fr) auto;padding:clamp(20px,4vw,48px);font-family:var(--fM);cursor:pointer;transform:{{ bootT }};transition:transform .45s cubic-bezier(.77,0,.18,1)\">\n        <div style=\"display:flex;justify-content:space-between;font-size:11px;letter-spacing:.1em;color:var(--steel)\"><span>AC / DRAWING SET \u2014 REV. 2026<\/span><span>CLICK TO SKIP<\/span><\/div>\n        <div style=\"display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:end;gap:32px\">\n          <div style=\"display:flex;flex-direction:column;gap:6px;font-size:11px;letter-spacing:.08em\">\n            <sc-for list=\"{{ bootSteps }}\" as=\"b\" hint-placeholder-count=\"8\">\n              <div style=\"display:flex;gap:14px;opacity:{{ b.o }};transition:opacity .15s steps(2) {{ b.d }}\"><span style=\"color:var(--acc)\">{{ b.n }}<\/span><span>{{ b.t }}<\/span><\/div>\n            <\/sc-for>\n          <\/div>\n          <div style=\"font-family:var(--fD);font-weight:var(--dW);font-stretch:var(--dSt);font-size:clamp(96px,22vw,280px);line-height:.8;letter-spacing:-.04em;font-variant-numeric:tabular-nums\"><span ref=\"{{ bootPct }}\">0<\/span><span style=\"color:var(--acc)\">%<\/span><\/div>\n        <\/div>\n        <div style=\"height:2px;background:var(--line);margin-top:24px\"><div ref=\"{{ bootBar }}\" style=\"height:100%;width:0;background:var(--acc)\"><\/div><\/div>\n      <\/div>\n    <\/sc-if>\n  <\/main>\n\n<\/div>\n<\/x-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;style&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;plate&quot;,&quot;plateDark&quot;],&quot;default&quot;:&quot;plate&quot;,&quot;tsType&quot;:&quot;'plate'|'plateDark'&quot;},&quot;font&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;default&quot;,&quot;geist&quot;,&quot;space&quot;,&quot;bigshoulders&quot;,&quot;chakra&quot;],&quot;default&quot;:&quot;default&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;easing&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;mechanical&quot;,&quot;smooth&quot;],&quot;default&quot;:&quot;mechanical&quot;,&quot;tsType&quot;:&quot;'mechanical'|'smooth'&quot;},&quot;zones&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;},&quot;crosshair&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;boot&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;}}\">\nconst STYLES = {\n  plate: { label: 'LIGHT', v: {\n    '--bg': '#d3d4d0', '--bg2': '#c6c7c3', '--ink': '#141414', '--steel': '#55575a', '--acc': 'oklch(0.52 0.15 255)', '--accInk': '#ffffff', '--line': '#aeafab',\n    '--sep': '1px solid #aeafab', '--frame': '0px solid transparent', '--frameTop': '0px solid transparent', '--innerSep': '0px solid transparent',\n    '--panel': '#e4e5e1', '--panel2': '#dcddd9', '--gap': '14px', '--pad': '18px 64px 48px', '--r': '6px',\n    '--cols': 'minmax(0,1fr) minmax(300px,36%)', '--infoOrd': '2', '--infoPad': '18px',\n    '--fD': \"'Archivo',sans-serif\", '--fB': \"'Archivo',sans-serif\", '--fM': \"'IBM Plex Mono',monospace\",\n    '--dW': '800', '--dTr': 'uppercase', '--dLS': '0', '--dLS2': '0', '--dSt': '125%', '--navLS': '0',\n    '--drawBg': '#e4e5e1', '--drawF': 'invert(1)', '--drawB': 'multiply', '--photoF': 'none', '--void': '#b3261e', '--plate': '#1a1b1c', '--plateInk': '#e8e8e4'\n  }},\n  plateDark: { label: 'DARK', v: {\n    '--bg': '#141516', '--bg2': '#1c1d1f', '--ink': '#e6e6e2', '--steel': '#9a9c9f', '--acc': 'oklch(0.72 0.13 250)', '--accInk': '#0e0f10', '--line': '#323437',\n    '--sep': '1px solid #323437', '--frame': '0px solid transparent', '--frameTop': '0px solid transparent', '--innerSep': '0px solid transparent',\n    '--panel': '#1f2022', '--panel2': '#252628', '--gap': '14px', '--pad': '18px 64px 48px', '--r': '6px',\n    '--cols': 'minmax(0,1fr) minmax(300px,36%)', '--infoOrd': '2', '--infoPad': '18px',\n    '--fD': \"'Archivo',sans-serif\", '--fB': \"'Archivo',sans-serif\", '--fM': \"'IBM Plex Mono',monospace\",\n    '--dW': '800', '--dTr': 'uppercase', '--dLS': '0', '--dLS2': '0', '--dSt': '125%', '--navLS': '0',\n    '--drawBg': '#1a1b1d', '--drawF': 'none', '--drawB': 'normal', '--photoF': 'brightness(.85)', '--void': '#ff8a80', '--plate': '#2c2e31', '--plateInk': '#ececE8'\n  }}\n};\nconst EASE = { mechanical: 'transform 760ms cubic-bezier(.77,0,.18,1)', smooth: 'transform 1000ms cubic-bezier(.22,1,.36,1)' };\nconst PROJECTS = [\n  {\n    id: 'minifab', num: '01', dwg: 'AC-01-MNF', title: 'Minifab', short: 'MINIFAB', tag: 'MICROFAB', period: '2024 \u2014 PRESENT', status: 'ONGOING',\n    desc: 'Highly customisable open source hybrid manufacturing machine capable of 3D printing and CNC milling.',\n    img: 'img/minifab_exploded.svg', photo: 'img/minifab.jpg',\n    details: [{ k: 'DATE', v: '2023 \u2014 2025' }, { k: 'CATEGORY', v: 'Micromanufacturing' }, { k: 'TEAM SIZE', v: '8 members' }],\n    tech: ['CNC Milling', '3D Printing', 'CAD/CAM', 'Motion Control'],\n    thirdLabel: 'ACHIEVEMENTS', third: ['Aluminum Milling', 'Open Source Design', 'Hybrid Manufacturing'],\n    table: [['Total Size', '800 \u00d7 700 \u00d7 650 mm'], ['Maximum Speed', '70 mm/s'], ['Aluminum DOC', 'TBD'], ['Work Envelope', 'TBD']],\n    overview: [\n      'Minifab is a highly customisable open source hybrid manufacturing machine capable of both 3D printing and CNC milling. Designed to bring professional-grade microfabrication capabilities to makers and small workshops.',\n      'The project focuses on creating a versatile platform that can switch between additive and subtractive manufacturing processes, enabling complex workflows that would typically require multiple machines.'\n    ]\n  },\n  {\n    id: 'reskin', num: '02', dwg: 'AC-02-RSK', title: 'reSkin', short: 'RESKIN', tag: 'E-SKIN / HCI', period: '2025 \u2014 PRESENT', status: 'ONGOING',\n    desc: 'Printed stretchable artificial skin that senses pressure and tells human touch from objects.',\n    img: 'img/reskin_exploded.svg',\n    details: [{ k: 'STARTED', v: '2025' }, { k: 'CATEGORY', v: 'Soft sensors / HCI' }, { k: 'TYPE', v: 'ESILV research project' }],\n    tech: ['Mutual capacitance (MUCA)', 'Stretchable silver ink (ACI SS1109)', 'TPU substrate, silicone spacer', 'FocalTech touch controller'],\n    thirdLabel: 'FOCUS', third: ['Reproducible printed fabrication', 'Characterization test bench', 'Pressure sensing', 'Human vs. object contact'],\n    table: [['Sensing principle', 'Mutual capacitance'], ['Electrodes', 'Printed stretchable silver ink'], ['Substrate', 'TPU'], ['Dielectric', 'Silicone spacer'], ['Readout', 'FocalTech-based touch controller'], ['Target application', 'Prosthetics']],\n    overview: [\n      \"reSkin is an iteration of Marc Teyssier's Skin-On, an artificial skin that senses touch through mutual capacitance. The goal is pressure sensing combined with discrimination between human and inanimate contact, for prosthetics.\",\n      \"The previous version used conductive yarn electrodes assembled by hand. Even with the same nominal thickness and electrode spacing, samples measured differently, and each iteration took too long to build. reSkin replaces the yarn with stretchable silver ink printed on TPU, with a silicone spacer as dielectric, for reproducible samples and fast iterations.\",\n      \"Current phase: validate one printed architecture, its reproducibility and a rigorous characterization bench. Raw readout through a FocalTech-based touch controller already works.\"\n    ]\n  },\n  {\n    id: 'espin', num: '03', dwg: 'AC-03-ESP', title: 'E-Spin', short: 'E-SPIN', tag: 'EMBEDDED HW', period: '2026', status: 'LAUNCHED',\n    desc: 'ESP32-C3 dev board with a 9 cm PCB ruler that spins on a bearing.', linkText: 'Check out the E-Spin project on Kickstarter.',\n    overview: ['E-Spin is an ESP32-C3 development board made of two stacked boards: a 9 cm PCB ruler on top spins on a 698ZZ bearing above the electronics board, which carries a 6-axis IMU, 8 addressable RGB LEDs, a LiPo battery with protection circuit, USB-C and 12 GPIO.', 'I co-founded the project and launched it on Kickstarter, where it passed 125 pre-orders in its first two weeks and moved to pre-production.'],\n    img: 'img/Exploded_details.png',\n    link: 'https://www.kickstarter.com/projects/322093471/e-spin?ref=ebfenp', linkLabel: 'VIEW ON KICKSTARTER'\n  },\n  {\n    id: 'am6', num: '04', dwg: 'AC-04-AM6', title: 'AM6 3D Printer', short: 'AM6', tag: 'ADDITIVE MFG', period: '2018 \u2014 PRESENT', status: 'ONGOING',\n    desc: 'Anet A6 kit from 2018, rebuilt on an AM6 aluminium extrusion frame and moved to Klipper firmware.',\n    img: 'img/am6_exploded.svg', photo: 'img/AM6.jpg',\n    details: [{ k: 'STARTED', v: '2018' }, { k: 'CATEGORY', v: 'Additive Manufacturing' }, { k: 'TYPE', v: 'Personal Project' }],\n    tech: ['Klipper Firmware', 'Additive Manufacturing', 'CAD Modeling', 'Mechanical Engineering'],\n    thirdLabel: 'SKILLS', third: ['Mechanical Assembly', 'Electronics Safety', 'Firmware Programming', '3D Modeling'],\n    table: [['Build Volume', '220 \u00d7 220 \u00d7 220 mm'], ['Maximum Print Speed', '300 mm/s'], ['Layer Resolution', '0.07 \u2014 0.35 mm'], ['Max Hotend Temperature', '280\u00b0C'], ['Max Bed Temperature', '90\u00b0C'], ['Firmware', 'Klipper']],\n    overview: [\n      'My journey into the world of 3D printing began in 2018 when my parents bought me an Anet A6 kit. What started as a simple assembly project sparked a deep passion for additive manufacturing and ultimately helped shape my path toward engineering. This printer has been continually evolving as my knowledge and skills have grown.',\n      'The original Anet A6 has undergone significant modifications over the years. I upgraded the frame with an AM6 extrusion kit for improved stability and precision. I also transitioned from the stock firmware to Marlin firmware, and then to Klipper, allowing for more advanced features and better print quality.',\n      'While not the fastest or most advanced printer by today\\'s standards, this machine has immense personal value. It represents my growth as a maker and engineer, showing how continuous iteration and learning can transform both a project and the person behind it.'\n    ],\n    learnIntro: 'This project has been instrumental in my development as an engineer:',\n    learnings: ['How to safely work with electronics, including power supplies, stepper motors, and heating elements', 'The fundamentals of mechanical design and how different components interact in a system', 'Programming and firmware customization to optimize machine performance', '3D modeling skills for both creating printable objects and designing machine upgrades', 'Problem-solving through numerous iterations and improvements'],\n    learnOutro: 'This printer was one of the key inspirations that led me to pursue engineering as a career path.',\n    gallery: [{ cap: 'FIG. 2 \u2014 ORIGINAL KIT', src: 'img/stock_a6.jpg', alt: 'Original Anet A6 Kit' }, { cap: 'FIG. 3 \u2014 AM6 UPGRADE', src: 'img/am6_kit.jpg', alt: 'AM6 Extrusion Upgrade' }, { cap: 'FIG. 4 \u2014 CURRENT', src: 'img/AM6.jpg', alt: 'Current Configuration' }]\n  },\n  {\n    id: 'fusion', num: '05', dwg: 'AC-05-F360', title: 'Fusion 360 Add-ins', short: 'FUSION', tag: 'CAD/CAM PLUGINS', period: '2025 \u2014 PRESENT', status: 'ONGOING',\n    desc: 'Four plugins I wrote in Python for Autodesk Fusion 360: cutting forces, tool inventory, extrusion profiles and 1:1 scale.',\n    img: 'img/fusion-toolkit.svg',\n    details: [{ k: 'STARTED', v: '2025' }, { k: 'CATEGORY', v: 'CAD / CAM Automation' }, { k: 'TYPE', v: '4 Fusion 360 Add-ins' }],\n    tech: ['Python (Fusion API)', 'adsk.cam / adsk.fusion', 'HTML/JS palettes', 'JSON data files'],\n    thirdLabel: 'SKILLS', third: ['Machining mechanics', 'CAM programming', 'Shop tooling logistics', 'Tool development'],\n    table: [['Cutting Force Estimator', 'Manufacture \u2014 force & deflection before cutting'], ['Tool Inventory', 'Manufacture \u2014 tool library and stock counts in sync'], ['Aluminium Extrusions', 'Design \u2014 slot profiles in one command'], ['1:1 Scale', 'Design \u2014 true physical size on screen']],\n    overview: [\n      'Autodesk Fusion 360 is the CAD/CAM software I use daily for design and CNC programming. Where it leaves a gap in my workflow, I write a Python add-in to close it. Each add-in started from a real problem in the workshop or on the machine, and each one runs inside Fusion instead of a separate spreadsheet or website.'\n    ],\n    notesTitle: 'Add-ins', prose: [\n      'CUTTING FORCE ESTIMATOR (FusionCuttingForce). Fusion CAM gives feeds and speeds, but no forces. The add-in reads tool and cut parameters from each toolpath, applies the Kienzle specific cutting force model and writes an HTML report with spindle power, torque and tool deflection. Fusion does not store rake or helix angles, so forces are shown as a range over the typical rake range of the material (e.g. Ft: 220\u2013240 N). Material data covers 13 materials, from 6061 to Inconel; kc1.1 serves as a calibration value against measured spindle load.',\n      'TOOL INVENTORY. Tool definitions lived in the Fusion tool library and physical counts in an Excel file. This palette in the Manufacture workspace reads the library live through the Fusion API, stores counts and per-tool minimum stock in a JSON sidecar on the shared network drive (30 s lock file for multi-user writes, lock-free reads), and shows OK / LOW / UNSTOCKED status with CSV export. Phase 1 is complete; phase 2 moves to a cloud backend. Source not public yet.',\n      'ALUMINIUM EXTRUSIONS (ExtrusionsGenerator). Adds an Aluminum Extrusion command next to Pipe in the Create panel. Select a series, profile and length: the add-in imports the DXF section, repairs small gaps so the sketch closes, extrudes the body in its own component, applies aluminium material and collapses the steps into one timeline group. Library: 2020, 2040, 2060, 2080, 4040, C-beam 4080.',\n      '1:1 SCALE (FusionScale). Sets the viewport to true physical size, so a ruler on the screen measures the design. Operating systems often report the wrong DPI, so the first run asks for the measured length of a 50 mm reference line and saves the correction factor. The button then uses an orthographic camera and Camera.setExtents() to show the visible area at physical size.'\n    ],\n    link: 'https://github.com/alex-crr?tab=repositories', linkLabel: 'VIEW ON GITHUB'\n  }\n];\nconst SKILLS = [{ name: '3D Printing', lvl: 4, tier: 'EXPERT', note: 'SINCE 2018 \u00b7 AM6, MINIFAB' }, { name: 'CAD Design', lvl: 3, tier: 'ADVANCED', note: 'MACHINE & PART DESIGN' }, { name: 'CNC Machining', lvl: 2, tier: 'PROFICIENT', note: 'ALUMINIUM MILLING \u00b7 MINIFAB' }, { name: 'Programming', lvl: 2, tier: 'PROFICIENT', note: 'FIRMWARE \u00b7 KLIPPER, MARLIN' }];\nconst EDU = [{ date: '2023 \u2014 2027', title: 'ESILV', sub: 'Engineering Degree' }, { date: '2022 \u2014 2023', title: 'EPITA', sub: 'Computer Science Engineering' }, { date: '2019 \u2014 2022', title: 'Lyc\u00e9e Stanislas', sub: 'STEM Program' }];\nconst CONTACTS = [\n  { label: 'EMAIL', value: 'alexandre.courrieu@edu.devinci.fr', href: 'mailto:alexandre.courrieu@edu.devinci.fr' },\n  { label: 'LINKEDIN', value: 'linkedin.com/in/alexandre-courrieu', href: 'https://linkedin.com/in/alexandre-courrieu' },\n  { label: 'GITHUB', value: 'github.com/alex-crr', href: 'https://github.com/alex-crr' }\n];\nconst BOOT = ['LOAD DRAWING REGISTER', 'MOUNT AC-01-AM6', 'MOUNT AC-02-MNF', 'MOUNT AC-03-ESP', 'MOUNT AC-04-F360', 'MOUNT AC-05-RSK', 'CALIBRATE GRID 6 \u00d7 4', 'RESOLVE TITLE BLOCKS', 'SYNC SHEET INDEX', 'READY'];\nconst LS_KEY = 'ac-portfolio-v2-style';\nconst FONTS = {\n  default: { v: null },\n  geist: { v: { '--fD': \"'Geist',sans-serif\", '--fB': \"'Geist',sans-serif\", '--fM': \"'Geist Mono',monospace\", '--dSt': '100%' } },\n  space: { v: { '--fD': \"'Space Grotesk',sans-serif\", '--fB': \"'Space Grotesk',sans-serif\", '--fM': \"'Space Mono',monospace\", '--dSt': '100%' } },\n  bigshoulders: { v: { '--fD': \"'Big Shoulders Display',sans-serif\", '--fB': \"'Instrument Sans',sans-serif\", '--fM': \"'Martian Mono',monospace\", '--dSt': '100%', '--dW': '800' } },\n  chakra: { v: { '--fD': \"'Chakra Petch',sans-serif\", '--fB': \"'Instrument Sans',sans-serif\", '--fM': \"'Chakra Petch',sans-serif\", '--dSt': '100%', '--dW': '700' } }\n};\n\nfunction sheetsFor(p) {\n  const s = [{ kind: 'drawing', title: 'GENERAL ARRANGEMENT' }];\n  if (p.table) s.push({ kind: 'spec', title: 'SPECIFICATIONS' });\n  if (p.prose || p.learnings) s.push({ kind: 'notes', title: p.prose ? (p.notesTitle || 'Notes').toUpperCase() : 'KEY LEARNINGS' });\n  if (p.gallery) s.push({ kind: 'gallery', title: 'DOCUMENTATION' });\n  if (p.link) s.push({ kind: 'link', title: 'REFERENCE' });\n  return s;\n}\nconst COLS = [{ label: 'INDEX', num: '00', rows: ['INDEX'] }]\n  .concat(PROJECTS.map(p => ({ label: p.short, num: p.num, rows: sheetsFor(p).map(s => s.title) })))\n  .concat([{ label: 'ABOUT', num: '06', rows: ['ABOUT', 'CONTACT'] }, { label: 'VOID', num: '07', rows: ['VOID'] }]);\nconst ABOUT_C = PROJECTS.length + 1, VOID_C = ABOUT_C + 1;\n// VOID page: withdrawn projects, newest first, PAUSED ones last. status: FAILED | ABANDONED | SUPERSEDED | HANDED OVER | PAUSED\n// cause: SCOPE | TECH LIMITS | MARKET | BETTER OPTION | PRIORITIES | TIME | COST. Optional: img 'img/\u2026', href (source), to (id of the live project it fed).\nconst VOID = [\n  { id: 'AC-V05', title: 'Cleo', years: '2024 \u2014 2025', status: 'ABANDONED', cause: 'TECH LIMITS',\n    why: 'Jarvis-style assistant on local LLMs, using tool calls into an SQL project database instead of RAG. Local French speech models were not usable, English ones failed
