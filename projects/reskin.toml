overview = [
  "reSkin is an iteration of Marc Teyssier's Skin-On, an artificial skin that senses touch through mutual capacitance. The goal is pressure sensing combined with discrimination between human and inanimate contact, for prosthetics.",
  "The previous version used conductive yarn electrodes assembled by hand. Even with the same nominal thickness and electrode spacing, samples measured differently, and each iteration took too long to build. reSkin replaces the yarn with stretchable silver ink printed on TPU, with a silicone spacer as dielectric, for reproducible samples and fast iterations.",
  "Current phase: validate one printed architecture, its reproducibility and a rigorous characterization bench. Raw readout through a FocalTech-based touch controller already works.",
]
