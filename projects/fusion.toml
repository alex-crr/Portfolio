[[cards]]
name = "Cutting Force Estimator"
repo = "FusionCuttingForce"
ws = "MANUFACTURE"
body = "Fusion CAM gives feeds and speeds, but no forces. Reads each toolpath, applies the Kienzle model and reports spindle power, torque and tool deflection, as a range since Fusion stores no rake angle. 13 materials, 6061 to Inconel."

[[cards]]
name = "Tool Inventory"
repo = "SOURCE NOT PUBLIC YET"
ws = "MANUFACTURE"
body = "Physical tool counts lived in an Excel file, apart from the Fusion tool library. This palette reads the library live, keeps counts and minimum stock in a shared JSON file with multi-user locking, and flags OK / LOW / UNSTOCKED."

[[cards]]
name = "Aluminium Extrusions"
repo = "ExtrusionsGenerator"
ws = "DESIGN"
body = "An Aluminum Extrusion command next to Pipe. Pick series, profile and length: it imports the section, closes small sketch gaps and builds the part in its own component, as one timeline group. 2020 to C-beam 4080."

[[cards]]
name = "1:1 Scale"
repo = "FusionScale"
ws = "DESIGN"
body = "Shows the design at true physical size, so a ruler held on the screen measures it. A one-time measurement of a 50 mm reference line corrects the wrong DPI most operating systems report."
