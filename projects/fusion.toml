  "Tool development",
]

[specs.details]
CATEGORY = "CAD / CAM Automation"
TYPE     = "4 Fusion 360 Add-ins"

[specs.table]
"Cutting Force Estimator" = "Manufacture — force & deflection before cutting"
"Tool Inventory"          = "Manufacture — tool library and stock counts in sync"
"Aluminium Extrusions"    = "Design — slot profiles in one command"
"1:1 Scale"               = "Design — true physical size on screen"

# ── notes sheet ──
[notes]
title = "Add-ins"

[[notes.cards]]
name      = "Cutting Force Estimator"
repo      = "FusionCuttingForce"
workspace = "MANUFACTURE"
text      = "Fusion CAM gives feeds and speeds, but no forces. Reads each toolpath, applies the Kienzle model and reports spindle power, torque and tool deflection, as a range since Fusion stores no rake angle. 13 materials, 6061 to Inconel."

[[notes.cards]]
name      = "Tool Inventory"
repo      = "SOURCE NOT PUBLIC YET"
workspace = "MANUFACTURE"
text      = "Physical tool counts lived in an Excel file, apart from the Fusion tool library. This palette reads the library live, keeps counts and minimum stock in a shared JSON file with multi-user locking, and flags OK / LOW / UNSTOCKED."

[[notes.cards]]
name      = "Aluminium Extrusions"
repo      = "ExtrusionsGenerator"
workspace = "DESIGN"
text      = "An Aluminum Extrusion command next to Pipe. Pick series, profile and length: it imports the section, closes small sketch gaps and builds the part in its own component, as one timeline group. 2020 to C-beam 4080."

[[notes.cards]]
name      = "1:1 Scale"
repo      = "FusionScale"
workspace = "DESIGN"
text      = "Shows the design at true physical size, so a ruler held on the screen measures it. A one-time measurement of a 50 mm reference line corrects the wrong DPI most operating systems report."

