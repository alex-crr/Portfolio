# ── featured column ──
[featured]
nav      = "FUSION"
field    = "CAD/CAM PLUGINS"
drawing  = "img/fusion-toolkit.svg"
overview = """
Autodesk Fusion 360 is the CAD/CAM software I use daily for design and CNC programming. Where it
leaves a gap in my workflow, I write a Python add-in to close it. Each add-in started from a real
problem in the workshop or on the machine, and each one runs inside Fusion instead of a separate
spreadsheet or website.
"""

# ── specifications sheet ──
[specs]
technologies     = [
  "Python (Fusion API)",
  "adsk.cam / adsk.fusion",
  "HTML/JS palettes",
  "JSON data files",
]
highlights_label = "SKILLS"
