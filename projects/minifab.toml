# ── featured column ──
[featured]
nav      = "MINIFAB"
field    = "MICROFAB"
drawing  = "img/minifab_exploded.svg"
photo    = "img/minifab.jpg"
overview = """
Minifab is a highly customisable open source hybrid manufacturing machine capable of both 3D
printing and CNC milling. Designed to bring professional-grade microfabrication capabilities to
makers and small workshops.

The project focuses on creating a versatile platform that can switch between additive and
subtractive manufacturing processes, enabling complex workflows that would typically require
multiple machines.
"""

