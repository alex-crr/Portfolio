title      = "AM6 3D Printer"
drawing_no = "AC-04-AM6"
period     = "2018 — PRESENT"
status     = "ACTIVE"
summary    = "Anet A6 kit from 2018, rebuilt on an AM6 aluminium extrusion frame and moved to Klipper firmware."
tags       = ["fabrication"]

# ── featured column ──
[featured]
nav      = "AM6"
field    = "ADDITIVE MFG"
drawing  = "img/am6_exploded.svg"
photo    = "img/AM6.jpg"
overview = """
My journey into the world of 3D printing began in 2018 when my parents bought me an Anet A6 kit.
What started as a simple assembly project sparked a deep passion for additive manufacturing and
ultimately helped shape my path toward engineering. This printer has been continually evolving as my
knowledge and skills have grown.

The original Anet A6 has undergone significant modifications over the years. I upgraded the frame
with an AM6 extrusion kit for improved stability and precision. I also transitioned from the stock
firmware to Marlin firmware, and then to Klipper, allowing for more advanced features and better
print quality.

While not the fastest or most advanced printer by today's standards, this machine has immense
personal value. It represents my growth as a maker and engineer, showing how continuous iteration
and learning can transform both a project and the person behind it.
"""

