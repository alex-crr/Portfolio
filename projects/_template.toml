# One file per project, holding everything about it. Copy this file and rename
# it: the file name is the project's id (hologram-clock.toml -> hologram-clock).
# Files starting with "_" are ignored. Then run:  python3 design/build.py
# The build numbers columns, sheets and figures itself, and refuses a file that
# is inconsistent (unknown key, wrong drawing_no, missing image...), listing why.

# ---- Shown everywhere: index register, lookup, void sheet ------------------
title      = "Project name"
drawing_no = "AC-L00"          # unique. AC-NN-XXX featured (column NN) · AC-Lnn log · AC-Vnn void
period     = "2026 — PRESENT"  # free text; its last year (or PRESENT) sorts the lists
status     = "ACTIVE"          # ACTIVE | LAUNCHED | DONE | PAUSED | ABANDONED | FAILED | SUPERSEDED | HANDED OVER
                               # PAUSED and after: void sheet, needs an AC-Vnn number
summary    = "One line for the lookup table."
tags       = ["electronics"]   # optional; lower case, each tag is a lookup filter, "vibecoded" is drawn dashed
# link = "https://github.com/alex-crr/..."  # optional; opened from the lookup
# partners_wanted = true       # optional; "partners wanted" + link to the contact sheet
# draft = true                 # optional; keeps the file off the site, no checks

# ---- Featured column: only with an AC-NN-XXX number ------------------------
# Everything below up to [void] needs [featured].
# [featured]
# nav      = "NAME"                   # nav tab label
# field    = "FIELD LABEL"            # drawing sheet title block and index
# drawing  = "img/x_exploded.svg"     # GENERAL ARRANGEMENT drawing
# photo    = "img/x.jpg"              # optional; adds the photo/drawing slider
# keep_drawing_colours = true         # optional; drawing keeps its colours in both themes
# overview = """
# First paragraph, may wrap
# over several lines.
#
# Second paragraph.
# """

# [specs]                             # optional; SPECIFICATIONS sheet ([specs.table] required)
# technologies     = ["..."]          # [S02] TECHNOLOGIES
# highlights_label = "SKILLS"         # [S03] heading
# highlights       = ["..."]
# [specs.details]                     # [S01] DETAILS rows in this order; PERIOD is added first by the build
# CATEGORY    = "..."                 # no STARTED/DATE/PERIOD/STATUS/FIELD/TITLE: already shown
# "TEAM SIZE" = "..."
# [specs.table]                       # TABLE 1 rows in this order
# "Build Volume" = "220 × 220 × 220 mm"

# [learnings]                         # optional; KEY LEARNINGS sheet (not with [notes])
# intro  = "..."
# points = ["..."]
# outro  = "..."

# [notes]                             # optional; notes sheet titled by title (not with [learnings])
# title = "Add-ins"
# text  = """Paragraphs, blank line between."""   # optional
# [[notes.cards]]                     # optional, repeat per card
# name      = "..."
# repo      = "..."
# workspace = "MANUFACTURE"
# text      = "..."

# [[gallery]]                         # optional, repeat per figure; DOCUMENTATION sheet, numbered FIG. 2, 3...
# caption = "ORIGINAL KIT"
# image   = "img/x_kit.jpg"
# alt     = "Original kit"

# [reference]                         # REFERENCE sheet; required when a featured project has a link
# text   = "Check out ... on Kickstarter."
# button = "VIEW ON KICKSTARTER"

# ---- Void card: only for PAUSED and after ----------------------------------
# [void]
# why          = "What it was, and why it stopped."  # optional; defaults to summary
# cause        = "SCOPE"     # SCOPE | TECH LIMITS | MARKET | BETTER OPTION | PRIORITIES | TIME | COST
# carried_into = "What it fed into"
# feeds        = "am6"       # optional; id of the live project it fed, turns carried_into into a link
# photo        = "img/void_x.jpg"   # optional; card photo, shown grey
